<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcul rentabilité E-commerce et Meta ads</title>
<meta name="description" content="Calculez la rentabilité d'une boutique en dropshipping avec Meta Ads : marge, CPA, ROAS, objectif de bénéfice, mise à l'échelle.">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Calcul rentabilité E-commerce et Meta ads</h1>
  <p>Modifiez les hypothèses : tout est recalculé instantanément et sauvegardé sur cet appareil.</p>
</header>

<section class="card scenbar noprint" aria-label="Produit ou scénario">
  <label>Produit / scénario <select id="sel"></select></label>
  <label>Nom <input id="nm" type="text" maxlength="60"></label>
  <div class="row">
    <button id="bnew" type="button">Nouveau</button>
    <button id="bdup" type="button">Dupliquer</button>
    <button id="bdel" type="button">Supprimer</button>
    <button id="bkexp" type="button" title="Télécharger tous vos produits dans un fichier">Sauvegarder</button>
    <button id="bkimp" type="button" title="Ajouter les produits d'un fichier de sauvegarde">Restaurer</button>
    <input id="bkfile" type="file" accept=".json,application/json" hidden>
    <span id="bkmsg" role="status"></span>
  </div>
</section>

<nav class="tabs noprint" id="tabs" aria-label="Sections">
  <button type="button" data-tab="calc">Calculateur</button>
  <button type="button" data-tab="goal">Objectif</button>
  <button type="button" data-tab="scale">Mise à l'échelle</button>
  <button type="button" data-tab="track">Suivi</button>
  <button type="button" data-tab="compare">Comparer</button>
</nav>

<div id="printhead"></div>

<main id="main">
  <section class="card noprint" id="inputs"></section>
  <div class="right">
    <section class="card noprint" id="tabctl" hidden></section>
    <div id="out"></div>
  </div>
</main>

<script src="calc.js"></script>
<script src="importer.js"></script>
<script src="app.js"></script>
</body>
</html>
